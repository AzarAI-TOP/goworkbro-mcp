[project]
name = "goworkbro-mcp"
version = "0.1.1"
description = "MCP server + CLI for GoWorkBro 电脑协同 — read and write todos, habits and countdowns over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azar", email = "noreply@azarai.top" }]
keywords = ["mcp", "bluetooth", "ble", "android", "goworkbro", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Topic :: Home Automation",
]
dependencies = ["bleak>=0.22", "mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/AzarAI-TOP/goworkbro-mcp"
Issues = "https://github.com/AzarAI-TOP/goworkbro-mcp/issues"

[project.scripts]
gwb = "goworkbro_mcp.cli:main"
gwb-mcp = "goworkbro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goworkbro_mcp"]

[dependency-groups]
dev = ["pytest"]
